<script>
  (function() {
    const toggleBtn = document.getElementById('notification-toggle');
    const knob = document.getElementById('toggle-knob');
    if (toggleBtn && knob) {
      let isChecked = true;
      toggleBtn.addEventListener('click', () => {
        isChecked = !isChecked;
        toggleBtn.setAttribute('aria-checked', String(isChecked));
        if (isChecked) {
          toggleBtn.classList.remove('bg-surface-container-highest', 'justify-start');
          toggleBtn.classList.add('bg-secondary-container', 'justify-end');
          knob.innerHTML = '<span class="material-symbols-outlined text-[11px] text-on-primary font-bold">check</span>';
        } else {
          toggleBtn.classList.remove('bg-secondary-container', 'justify-end');
          toggleBtn.classList.add('bg-surface-container-highest', 'justify-start');
          knob.innerHTML = '';
        }
      });
    }

    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        logoutBtn.classList.add('scale-95');
        setTimeout(() => logoutBtn.classList.remove('scale-95'), 150);
      });
    }
  })();
